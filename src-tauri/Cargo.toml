[package]
name = "todolist"
version = "0.1.0"
description = "开发任务的结构化清单"
authors = ["you"]
edition = "2024"

[lib]
# `_lib` 后缀是为了让 lib 名与 bin 名不冲突（Windows 上会撞名，
# 见 https://github.com/rust-lang/cargo/issues/8519）。
name = "todolist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# `bundled` 把 SQLite 源码编进二进制：不再依赖系统里有没有 sqlite3.dll，
# 安装包也因此自带确定的 SQLite 版本。
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
# 只用于验证 IPC 上的字段名契约（camelCase / 枚举值），不进发布二进制。
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
