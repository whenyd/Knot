[package]
name = "knot"
version = "0.1.1"
description = "A local-first desktop task manager for developer work"
authors = ["Whenyd"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name from colliding with the binary name
# on Windows; see https://github.com/rust-lang/cargo/issues/8519.
name = "knot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# `bundled` compiles SQLite into the binary: no dependency on a system
# sqlite3.dll, and the installer ships a known SQLite version.
rusqlite = { version = "0.41", features = ["bundled"] }
# Used only in `domain.rs` to read the local time (start/end timestamps on status changes).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Startup failures are passed to the error window as JSON; tests also use it
# to verify the IPC wire shape.
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
