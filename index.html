<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the theme before styles load so the first paint never flashes light (CSP is null, inline allowed).
      (() => {
        try {
          const stored = localStorage.getItem("knot.theme.v1");
          const mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "light";
          const dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();

      // Resolve the language before the first paint; the module repeats this
      // and owns all visible text.
      (() => {
        try {
          const stored = localStorage.getItem("knot.language.v1");
          const mode =
            stored === "zh" || stored === "en" || stored === "system" ? stored : "system";
          const tag = (navigator.language ?? "").toLowerCase();
          const language = mode === "system" ? (tag.startsWith("zh") ? "zh" : "en") : mode;
          document.documentElement.lang = language === "zh" ? "zh-CN" : "en-US";
          document.documentElement.dataset.language = language;
        } catch {
          document.documentElement.lang = "zh-CN";
          document.documentElement.dataset.language = "zh";
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knot</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- 16px stroked icons; status icons use currentColor so they follow the theme. -->
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-chevron" viewBox="0 0 16 16">
        <path
          d="M4 6l4 4 4-4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 16 16">
        <path
          d="M8 3.5v9M3.5 8h9"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="i-status-todo" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5" />
      </symbol>
      <symbol id="i-status-doing" viewBox="0 0 16 16">
        <circle
          cx="8"
          cy="8"
          r="5.25"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          opacity=".45"
        />
        <path d="M8 2.75a5.25 5.25 0 0 1 0 10.5z" fill="currentColor" />
      </symbol>
      <symbol id="i-status-done" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="6" fill="currentColor" />
        <path
          d="M5 8.2l2 2 4.2-4.4"
          fill="none"
          stroke="#fff"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3" />
        <path
          d="M8 1.5v1.4M8 13.1v1.4M1.5 8h1.4M13.1 8h1.4M3.4 3.4l1 1M11.6 11.6l1 1M12.6 3.4l-1 1M4.4 11.6l-1 1"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 16 16">
        <path
          d="M13.2 9.8A5.5 5.5 0 0 1 6.2 2.8a5.5 5.5 0 1 0 7 7z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-monitor" viewBox="0 0 16 16">
        <rect
          x="2.2"
          y="3"
          width="11.6"
          height="8"
          rx="1.2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
        <path
          d="M6 13.2h4M8 11v2.2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="i-minimize" viewBox="0 0 16 16">
        <path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.3" />
      </symbol>
      <symbol id="i-maximize" viewBox="0 0 16 16">
        <rect
          x="3.5"
          y="3.5"
          width="9"
          height="9"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
      </symbol>
      <symbol id="i-restore" viewBox="0 0 16 16">
        <rect
          x="3.5"
          y="5.5"
          width="7"
          height="7"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
        <path
          d="M5.5 5.5V3.5h7v7h-2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
      </symbol>
      <symbol id="i-close" viewBox="0 0 16 16">
        <path
          d="M4 4l8 8M12 4l-8 8"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
      </symbol>
      <symbol id="i-globe" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3" />
        <path
          d="M2.5 8h11M8 2.5c1.4 1.5 2.1 3.4 2.1 5.5S9.4 12 8 13.5C6.6 12 5.9 10.1 5.9 8S6.6 4 8 2.5z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
        />
      </symbol>
    </svg>

    <div class="app">
      <!-- In-app top bar: doubles as a custom title bar on Windows; macOS uses native traffic lights. -->
      <header class="topbar">
        <button
          class="project-btn"
          id="project-btn"
          type="button"
          aria-haspopup="menu"
          aria-expanded="false"
          data-i18n-title="nav.projectMenu"
        >
          <span data-i18n="nav.projects"></span>
          <svg class="icon project-caret" viewBox="0 0 16 16" aria-hidden="true">
            <use href="#i-chevron"></use>
          </svg>
        </button>
        <div class="titlebar-drag" id="titlebar-drag" data-tauri-drag-region></div>
        <div
          class="filter-groups"
          id="filters"
          data-i18n-aria-label="filter.tasksAria"
        ></div>
        <div class="window-controls" id="window-controls">
          <button
            class="window-btn"
            id="window-min"
            type="button"
            data-i18n-title="window.minimize"
            data-i18n-aria-label="window.minimize"
          >
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <use href="#i-minimize"></use>
            </svg>
          </button>
          <button
            class="window-btn"
            id="window-max"
            type="button"
            data-i18n-title="window.maximize"
            data-i18n-aria-label="window.maximize"
          >
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <use href="#i-maximize"></use>
            </svg>
          </button>
          <button
            class="window-btn close"
            id="window-close"
            type="button"
            data-i18n-title="window.close"
            data-i18n-aria-label="window.close"
          >
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <use href="#i-close"></use>
            </svg>
          </button>
        </div>
      </header>

      <div class="workspace">
        <!-- Sidebar: "My tasks" is always on top; the module/submodule tree sits under the current project name. -->
        <aside class="sidebar" id="sidebar">
          <nav class="side-group" id="todo-section"></nav>

          <div class="side-heading" id="project-heading" hidden></div>
          <nav class="side-group" id="scope-section"></nav>

          <!-- Shown in dev builds only; in release builds import.meta.env.DEV is false, so it stays hidden. -->
          <button class="side-add dev-reset" id="dev-reset" type="button" hidden>
            <span data-i18n="dev.reset"></span>
          </button>
        </aside>

        <!-- Sidebar width handle: zero-width placeholder; a 10px drag area straddles the sidebar border. -->
        <div
          class="sidebar-resizer"
          id="sidebar-resizer"
          role="separator"
          aria-orientation="vertical"
          data-i18n-aria-label="resize.sidebar"
          tabindex="0"
        ></div>

        <main class="main">
          <div class="grid-scroll" id="grid-scroll">
            <table class="grid" id="grid">
              <colgroup>
                <col data-col="status" style="width: 64px" />
                <col data-col="title" />
                <col data-col="priority" style="width: 92px" />
                <col data-col="created" style="width: 176px" />
                <col data-col="start" style="width: 176px" />
                <col data-col="end" style="width: 176px" />
                <col data-col="note" style="width: 150px" />
              </colgroup>
              <thead>
                <tr>
                  <th data-col="status">
                    <span data-i18n="column.status"></span><span class="col-resizer" data-boundary="status:title"></span>
                  </th>
                  <th data-col="title">
                    <span data-i18n="column.title"></span><span class="col-resizer" data-boundary="title:priority"></span>
                  </th>
                  <th data-col="priority" aria-sort="none">
                    <span data-i18n="column.priority"></span><button class="sort-btn" type="button" data-sort="priority">⇅</button><span class="col-resizer" data-boundary="priority:created"></span>
                  </th>
                  <th data-col="created" aria-sort="none">
                    <span data-i18n="column.created"></span><button class="sort-btn" type="button" data-sort="created">⇅</button><span class="col-resizer" data-boundary="created:start"></span>
                  </th>
                  <th data-col="start" aria-sort="none">
                    <span data-i18n="column.start"></span><button class="sort-btn" type="button" data-sort="start">⇅</button><span class="col-resizer" data-boundary="start:end"></span>
                  </th>
                  <th data-col="end" aria-sort="none">
                    <span data-i18n="column.end"></span><button class="sort-btn" type="button" data-sort="end">⇅</button><span class="col-resizer" data-boundary="end:note"></span>
                  </th>
                  <th data-col="note"><span data-i18n="column.note"></span></th>
                </tr>
              </thead>
              <tbody id="grid-body"></tbody>
            </table>
            <p class="empty" id="empty" hidden></p>
          </div>

          <form class="add" id="task-form">
            <input
              id="task-input"
              data-i18n-placeholder="task.addPlaceholder"
              autocomplete="off"
              spellcheck="false"
            />
            <button
              class="add-option add-module"
              id="task-module"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
              data-i18n-title="scope.module"
              data-i18n-aria-label="scope.module"
            >
              <span class="add-option-label" id="task-module-label"></span>
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <use href="#i-chevron"></use>
              </svg>
            </button>
            <button
              class="add-option add-priority"
              id="task-priority"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
              data-i18n-title="priority.label"
              data-i18n-aria-label="priority.label"
            >
              <span class="add-option-label" id="task-priority-label"></span>
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <use href="#i-chevron"></use>
              </svg>
            </button>
          </form>
        </main>
      </div>

      <footer class="statusbar" data-i18n-aria-label="statusbar.aria">
        <div class="status-right">
          <span class="status-count" id="status-count"></span>
          <span class="status-sep" aria-hidden="true"></span>
          <button
            class="status-btn"
            id="language-btn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            data-i18n-title="language.switch"
            data-i18n-aria-label="language.switch"
          >
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <use href="#i-globe"></use>
            </svg>
            <span id="language-label"></span>
          </button>
          <button
            class="status-btn"
            id="theme-btn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            data-i18n-title="theme.switch"
            data-i18n-aria-label="theme.switch"
          >
            <svg class="icon" id="theme-icon" viewBox="0 0 16 16" aria-hidden="true">
              <use href="#i-sun"></use>
            </svg>
            <span id="theme-label" data-i18n="theme.light"></span>
          </button>
          <button
            class="status-btn"
            id="about-btn"
            type="button"
            data-i18n-title="about.label"
            data-i18n="about.label"
          ></button>
        </div>
      </footer>
    </div>

    <div class="notice" id="notice" role="status" hidden></div>
    <div class="resize-tip" id="resize-tip" hidden></div>

    <!-- Confirm dialog:
         "tell how many rows are affected, then confirm" is the global shape, used by deletes and cascade-done.
         Not window.confirm: that is the browser's native dialog, with uncontrolled styling and keyboard behavior. -->
    <div class="modal" id="modal" hidden>
      <div class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-body" id="modal-body"></p>
        <label class="modal-field" id="modal-field" hidden>
          <span class="modal-label" id="modal-label"></span>
          <input class="modal-input" id="modal-input" autocomplete="off" spellcheck="false" />
          <textarea class="modal-textarea" id="modal-textarea" rows="6" hidden></textarea>
        </label>
        <div class="modal-actions">
          <button class="btn" id="modal-cancel" type="button" data-i18n="common.cancel"></button>
          <button class="btn btn-primary" id="modal-ok" type="button"></button>
        </div>
      </div>
    </div>

    <div class="modal" id="about-modal" hidden>
      <div class="modal-card about-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
        <div class="about-head">
          <div class="about-logo" aria-hidden="true">
            <img id="about-icon" alt="" width="40" height="40" />
          </div>
          <div class="about-heading">
            <h2 class="about-title" id="about-title">Knot</h2>
            <span class="about-version" id="about-version">v0.1.1</span>
          </div>
        </div>

        <p class="about-desc" data-i18n="about.desc"></p>

        <dl class="about-rows">
          <div class="about-row">
            <dt data-i18n="about.version"></dt>
            <dd id="about-version-row">0.1.1</dd>
          </div>
          <div class="about-row">
            <dt data-i18n="about.platform"></dt>
            <dd id="about-platform">Windows · x64</dd>
          </div>
          <div class="about-row">
            <dt data-i18n="about.runtime"></dt>
            <dd id="about-runtime">Tauri 2 · WebView2</dd>
          </div>
          <div class="about-row">
            <dt data-i18n="about.license"></dt>
            <dd>MIT</dd>
          </div>
          <div class="about-row">
            <dt data-i18n="about.copyright"></dt>
            <dd>© 2026 Whenyd</dd>
          </div>
        </dl>

        <div class="modal-actions">
          <button class="btn btn-primary" id="about-ok" type="button" data-i18n="common.ok"></button>
        </div>
      </div>
    </div>
  </body>
</html>
