<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待办</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <!-- 左栏：最上方恒为「待办」，下面才是项目分段与项目列表 -->
      <aside class="sidebar">
        <nav class="side-group" id="todo-section"></nav>

        <div class="side-heading">项目</div>
        <nav class="side-group" id="project-section"></nav>

        <form class="side-form" id="project-form" hidden>
          <input
            id="project-input"
            placeholder="项目名，回车创建"
            autocomplete="off"
            spellcheck="false"
          />
        </form>
        <button class="side-add" id="project-add" type="button">＋ 新建项目</button>

        <!-- 范围树：全部 / 模块 / 子模块 / 未分类。「待办」没有这层。
             新建与重命名的入口都在右键菜单里，这里不再摆按钮。 -->
        <div class="side-heading" id="scope-heading">范围</div>
        <nav class="side-group" id="scope-section"></nav>
      </aside>

      <main class="main">
        <header class="toolbar">
          <h1 class="view-title" id="view-title">待办</h1>
          <span class="badge" id="view-count"></span>
        </header>

        <div class="grid-scroll">
          <table class="grid">
            <colgroup>
              <col style="width: 52px" />
              <col />
              <col style="width: 78px" />
              <col style="width: 220px" />
              <col style="width: 36px" />
            </colgroup>
            <thead>
              <tr>
                <th>状态</th>
                <th>任务</th>
                <th>优先级</th>
                <th>备注</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="grid-body"></tbody>
          </table>
          <p class="empty" id="empty" hidden></p>
        </div>

        <form class="add" id="task-form">
          <input
            id="task-input"
            placeholder="添加任务，回车保存（默认“未分类 / 中”）"
            autocomplete="off"
            spellcheck="false"
          />
        </form>
      </main>
    </div>

    <div class="notice" id="notice" role="status" hidden></div>

    <!-- 确认框：
         「先告知影响条数再确认」是全局形状，删除、级联完成都走它。
         不用 window.confirm：那是浏览器的原生对话框，样式与键盘行为都不受控。 -->
    <div class="modal" id="modal" hidden>
      <div class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-body" id="modal-body"></p>
        <label class="modal-field" id="modal-field" hidden>
          <span class="modal-label" id="modal-label"></span>
          <input class="modal-input" id="modal-input" autocomplete="off" spellcheck="false" />
          <textarea class="modal-textarea" id="modal-textarea" rows="6" hidden></textarea>
        </label>
        <div class="modal-actions">
          <button class="btn" id="modal-cancel" type="button">取消</button>
          <button class="btn btn-primary" id="modal-ok" type="button"></button>
        </div>
      </div>
    </div>
  </body>
</html>
