<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 先定主题再加载样式，避免首屏先闪一下浅色（CSP 为 null，允许内联）。
      (() => {
        try {
          const stored = localStorage.getItem("knot.theme.v1");
          const mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "light";
          const dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knot</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- 16px 描边图标；状态图标使用 currentColor，随主题变色。 -->
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-chevron" viewBox="0 0 16 16">
        <path
          d="M4 6l4 4 4-4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 16 16">
        <path
          d="M8 3.5v9M3.5 8h9"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="i-status-todo" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5" />
      </symbol>
      <symbol id="i-status-doing" viewBox="0 0 16 16">
        <circle
          cx="8"
          cy="8"
          r="5.25"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          opacity=".45"
        />
        <path d="M8 2.75a5.25 5.25 0 0 1 0 10.5z" fill="currentColor" />
      </symbol>
      <symbol id="i-status-done" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="6" fill="currentColor" />
        <path
          d="M5 8.2l2 2 4.2-4.4"
          fill="none"
          stroke="#fff"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3" />
        <path
          d="M8 1.5v1.4M8 13.1v1.4M1.5 8h1.4M13.1 8h1.4M3.4 3.4l1 1M11.6 11.6l1 1M12.6 3.4l-1 1M4.4 11.6l-1 1"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 16 16">
        <path
          d="M13.2 9.8A5.5 5.5 0 0 1 6.2 2.8a5.5 5.5 0 1 0 7 7z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="i-monitor" viewBox="0 0 16 16">
        <rect
          x="2.2"
          y="3"
          width="11.6"
          height="8"
          rx="1.2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
        <path
          d="M6 13.2h4M8 11v2.2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="i-minimize" viewBox="0 0 16 16">
        <path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.3" />
      </symbol>
      <symbol id="i-maximize" viewBox="0 0 16 16">
        <rect
          x="3.5"
          y="3.5"
          width="9"
          height="9"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
      </symbol>
      <symbol id="i-restore" viewBox="0 0 16 16">
        <rect
          x="3.5"
          y="5.5"
          width="7"
          height="7"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
        <path
          d="M5.5 5.5V3.5h7v7h-2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
      </symbol>
      <symbol id="i-close" viewBox="0 0 16 16">
        <path
          d="M4 4l8 8M12 4l-8 8"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
        />
      </symbol>
    </svg>

    <div class="app">
      <!-- 应用内顶栏：Windows 下兼作自绘标题栏；macOS 使用原生红绿灯。 -->
      <header class="topbar">
        <button
          class="project-btn"
          id="project-btn"
          type="button"
          aria-haspopup="menu"
          aria-expanded="false"
          title="项目菜单"
        >
          <span>项目</span>
          <svg class="icon project-caret" viewBox="0 0 16 16" aria-hidden="true">
            <use href="#i-chevron"></use>
          </svg>
        </button>
        <div class="titlebar-drag" id="titlebar-drag" data-tauri-drag-region></div>
        <div class="filter-groups" id="filters" aria-label="任务筛选"></div>
        <div class="window-controls" id="window-controls">
          <button class="window-btn" id="window-min" type="button" title="最小化" aria-label="最小化">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <use href="#i-minimize"></use>
            </svg>
          </button>
          <button class="window-btn" id="window-max" type="button" title="最大化" aria-label="最大化">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <use href="#i-maximize"></use>
            </svg>
          </button>
          <button class="window-btn close" id="window-close" type="button" title="关闭" aria-label="关闭">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <use href="#i-close"></use>
            </svg>
          </button>
        </div>
      </header>

      <div class="workspace">
        <!-- 左栏：「我的待办」恒在最上；当前项目名下面是模块/子模块树。 -->
        <aside class="sidebar" id="sidebar">
          <nav class="side-group" id="todo-section"></nav>

          <div class="side-heading" id="project-heading" hidden></div>
          <nav class="side-group" id="scope-section"></nav>

          <!-- 仅开发版显示；正式构建里 import.meta.env.DEV 为 false，永远保持隐藏。 -->
          <button class="side-add dev-reset" id="dev-reset" type="button" hidden>
            重置数据库（开发）
          </button>
        </aside>

        <!-- 左栏宽度把手：零宽占位，10px 的可拖区域跨在左栏边框两侧。 -->
        <div
          class="sidebar-resizer"
          id="sidebar-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="调整左栏宽度"
          tabindex="0"
        ></div>

        <main class="main">
          <div class="grid-scroll" id="grid-scroll">
            <table class="grid" id="grid">
              <colgroup>
                <col data-col="status" style="width: 44px" />
                <col data-col="title" />
                <col data-col="priority" style="width: 76px" />
                <col data-col="created" style="width: 140px" />
                <col data-col="start" style="width: 140px" />
                <col data-col="end" style="width: 140px" />
                <col data-col="note" style="width: 160px" />
              </colgroup>
              <thead>
                <tr>
                  <th data-col="status">
                    状态<span class="col-resizer" data-boundary="status:title"></span>
                  </th>
                  <th data-col="title">
                    任务<span class="col-resizer" data-boundary="title:priority"></span>
                  </th>
                  <th data-col="priority" aria-sort="none">
                    优先级<button class="sort-btn" type="button" data-sort="priority" aria-label="按优先级排序" title="按优先级排序">⇅</button><span class="col-resizer" data-boundary="priority:created"></span>
                  </th>
                  <th data-col="created" aria-sort="none">
                    创建<button class="sort-btn" type="button" data-sort="created" aria-label="按创建时间排序" title="按创建时间排序">⇅</button><span class="col-resizer" data-boundary="created:start"></span>
                  </th>
                  <th data-col="start" aria-sort="none">
                    开始<button class="sort-btn" type="button" data-sort="start" aria-label="按开始时间排序" title="按开始时间排序">⇅</button><span class="col-resizer" data-boundary="start:end"></span>
                  </th>
                  <th data-col="end" aria-sort="none">
                    结束<button class="sort-btn" type="button" data-sort="end" aria-label="按结束时间排序" title="按结束时间排序">⇅</button><span class="col-resizer" data-boundary="end:note"></span>
                  </th>
                  <th data-col="note">备注</th>
                </tr>
              </thead>
              <tbody id="grid-body"></tbody>
            </table>
            <p class="empty" id="empty" hidden></p>
          </div>

          <form class="add" id="task-form">
            <input
              id="task-input"
              placeholder="添加任务，回车保存（优先级中）"
              autocomplete="off"
              spellcheck="false"
            />
          </form>
        </main>
      </div>

      <footer class="statusbar" aria-label="状态栏">
        <div class="status-right">
          <span class="status-count" id="status-count"></span>
          <span class="status-sep" aria-hidden="true"></span>
          <button
            class="status-btn"
            id="theme-btn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            title="切换主题"
          >
            <svg class="icon" id="theme-icon" viewBox="0 0 16 16" aria-hidden="true">
              <use href="#i-sun"></use>
            </svg>
            <span id="theme-label">浅色</span>
          </button>
          <button class="status-btn" id="about-btn" type="button" title="关于">关于</button>
        </div>
      </footer>
    </div>

    <div class="notice" id="notice" role="status" hidden></div>
    <div class="resize-tip" id="resize-tip" hidden></div>

    <!-- 确认框：
         「先告知影响条数再确认」是全局形状，删除、级联完成都走它。
         不用 window.confirm：那是浏览器的原生对话框，样式与键盘行为都不受控。 -->
    <div class="modal" id="modal" hidden>
      <div class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-body" id="modal-body"></p>
        <label class="modal-field" id="modal-field" hidden>
          <span class="modal-label" id="modal-label"></span>
          <input class="modal-input" id="modal-input" autocomplete="off" spellcheck="false" />
          <textarea class="modal-textarea" id="modal-textarea" rows="6" hidden></textarea>
        </label>
        <div class="modal-actions">
          <button class="btn" id="modal-cancel" type="button">取消</button>
          <button class="btn btn-primary" id="modal-ok" type="button"></button>
        </div>
      </div>
    </div>

    <div class="modal" id="about-modal" hidden>
      <div class="modal-card about-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
        <div class="about-head">
          <div class="about-logo" aria-hidden="true">
            <img id="about-icon" alt="" width="40" height="40" />
          </div>
          <div class="about-heading">
            <h2 class="about-title" id="about-title">Knot</h2>
            <span class="about-version" id="about-version">v0.1.1</span>
          </div>
        </div>

        <p class="about-desc">AI时代本地优先的个人桌面待办应用</p>

        <dl class="about-rows">
          <div class="about-row">
            <dt>版本</dt>
            <dd id="about-version-row">0.1.1</dd>
          </div>
          <div class="about-row">
            <dt>平台</dt>
            <dd id="about-platform">Windows · x64</dd>
          </div>
          <div class="about-row">
            <dt>运行时</dt>
            <dd id="about-runtime">Tauri 2 · WebView2</dd>
          </div>
          <div class="about-row">
            <dt>许可证</dt>
            <dd>MIT</dd>
          </div>
          <div class="about-row">
            <dt>版权</dt>
            <dd>© 2026 Whenyd</dd>
          </div>
        </dl>

        <div class="modal-actions">
          <button class="btn btn-primary" id="about-ok" type="button">确定</button>
        </div>
      </div>
    </div>
  </body>
</html>
